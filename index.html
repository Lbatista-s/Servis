<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Aplica el tema guardado antes del primer pintado para evitar un destello.
      try {
        var guardado = JSON.parse(localStorage.getItem('servis:tema') || 'null');
        var modo = guardado && guardado.state && guardado.state.modo;
        document.documentElement.dataset.theme = modo === 'oscuro' ? 'oscuro' : 'claro';
      } catch (e) {
        document.documentElement.dataset.theme = 'claro';
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SERVIS — Sistema de Emisión y Registro Virtual de Servicios Institucionales del Área de Ingenierías del INTEC."
    />
    <title>SERVIS — Servicios Institucionales INTEC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
